name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit
      - name: Scan Python source
        run: bandit -q -r src -ll
      - name: Run pytest
        run: |
          PYTHONPATH=src pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --file docker/Dockerfile --tag multimodal-rag-backend:ci .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag multimodal-rag-frontend:ci frontend
      - name: Validate Compose configuration
        run: docker compose --file docker/docker-compose.yml config --quiet
