services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - HF_HOME=/app/artifacts/model-cache
      # Download only the pinned model revisions on first container startup;
      # the artifacts volume retains them for subsequent offline starts.
      - MODEL_LOCAL_FILES_ONLY=${MODEL_LOCAL_FILES_ONLY:-false}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      # The no-colon default preserves an intentionally empty revision for a
      # locally trained checkpoint.
      - RERANKER_REVISION=${RERANKER_REVISION-233902d25c440f23af6f7d6e94d2946bac0bee0a}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Ollama is optional and runs on the local host, not in this container.
      - ANSWER_SYNTHESIS_ENABLED=${ANSWER_SYNTHESIS_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - ALLOW_REMOTE_SYNTHESIS=${ALLOW_REMOTE_SYNTHESIS:-false}
      - RAG_API_KEY=${RAG_API_KEY:-}
    volumes:
      - ../artifacts:/app/artifacts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-8g}
    cpus: ${BACKEND_CPU_LIMIT:-4.0}
    tmpfs:
      - /tmp:size=512m,noexec,nosuid

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-1g}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
